<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Something is taking shape. Made by Kirat."
    />
    <title>Coming Soon — Made by Kirat</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap");

      :root {
        --background: #050508;
        --foreground: #f4f4f6;
        --muted: #71717a;
        --accent: #a7f3d0;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family: "Space Grotesk", sans-serif;
      }

      .page {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100vw;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 45%,
            rgba(16, 185, 129, 0.07),
            transparent 30%
          ),
          radial-gradient(
            circle at 78% 18%,
            rgba(99, 102, 241, 0.06),
            transparent 24%
          ),
          var(--background);
      }

      canvas {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
      }

      .grid {
        position: absolute;
        inset: 0;
        z-index: 1;
        opacity: 0.035;
        pointer-events: none;
        background-image:
          linear-gradient(
            rgba(255, 255, 255, 0.35) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.35) 1px,
            transparent 1px
          );
        background-size: 64px 64px;
      }

      header,
      main,
      footer {
        position: relative;
        z-index: 2;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 13px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.025);
        backdrop-filter: blur(14px);
        color: #71717a;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .status-dot {
        position: relative;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #a7f3d0;
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.8);
      }

      .status-dot::after {
        position: absolute;
        inset: -4px;
        border: 1px solid rgba(52, 211, 153, 0.45);
        border-radius: 50%;
        animation: pulse 2.5s ease-out infinite;
        content: "";
      }

      .year {
        color: #52525b;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      main {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        padding: 24px 24px 80px;
        text-align: center;
      }

      .hero {
        position: relative;
        max-width: 900px;
      }

      .hero::before {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: -1;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.04);
        filter: blur(100px);
        transform: translate(-50%, -50%);
        content: "";
      }

      .eyebrow {
        margin: 0;
        animation: breathe 4s ease-in-out infinite;
        color: rgba(167, 243, 208, 0.9);
        filter: drop-shadow(0 0 12px rgba(52, 211, 153, 0.3));
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.38em;
        text-transform: uppercase;
      }

      h1 {
        margin: 30px 0 0;
        color: var(--foreground);
        font-size: clamp(3.2rem, 9vw, 7rem);
        font-weight: 300;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }

      .divider {
        width: 48px;
        height: 1px;
        margin: 36px auto 0;
        background: rgba(167, 243, 208, 0.65);
        box-shadow: 0 0 18px rgba(52, 211, 153, 0.45);
      }

      .subtitle {
        margin: 28px 0 0;
        color: #71717a;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .creator,
      .footer-note {
        margin: 0;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .creator {
        color: #71717a;
      }

      .footer-note {
        color: #3f3f46;
        text-align: right;
      }

      @keyframes pulse {
        0% {
          opacity: 0.8;
          transform: scale(0.8);
        }

        70%,
        100% {
          opacity: 0;
          transform: scale(2.4);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.68;
        }

        50% {
          opacity: 1;
        }
      }

      @media (min-width: 640px) {
        header,
        footer {
          padding: 40px 48px;
        }

        main {
          padding: 48px 48px 96px;
        }

        .status,
        .year,
        .creator,
        .footer-note {
          font-size: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .eyebrow,
        .status-dot::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <canvas id="particle-canvas" aria-hidden="true"></canvas>
      <div class="grid" aria-hidden="true"></div>

      <header>
        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>In development</span>
        </div>

        <span class="year">2026 / 01</span>
      </header>

      <main>
        <section class="hero" aria-labelledby="main-heading">
          <p class="eyebrow">Coming Soon</p>

          <h1 id="main-heading">Something is taking shape.</h1>

          <div class="divider" aria-hidden="true"></div>

          <p class="subtitle">Stay close</p>
        </section>
      </main>

      <footer>
        <p class="creator">Made by Kirat</p>
        <p class="footer-note">Quietly in progress</p>
      </footer>
    </div>

    <script>
      const canvas = document.getElementById("particle-canvas");
      const context = canvas.getContext("2d");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );

      const particleCount = 84;
      const pointer = {
        x: 0,
        y: 0,
        active: false,
      };

      let width = 0;
      let height = 0;
      let ratio = 1;
      let particles = [];
      let animationFrame = 0;

      function createParticle(fromBottom = false) {
        return {
          x: Math.random() * width,
          y: fromBottom
            ? height + Math.random() * 24
            : Math.random() * height,
          radius: 0.65 + Math.random() * 1.9,
          alpha: 0.18 + Math.random() * 0.52,
          speed: 0.08 + Math.random() * 0.2,
          drift: 0.12 + Math.random() * 0.42,
          phase: Math.random() * Math.PI * 2,
          color: Math.random() > 0.18 ? "#a7f3d0" : "#a5b4fc",
        };
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        ratio = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = width * ratio;
        canvas.height = height * ratio;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;

        context.setTransform(ratio, 0, 0, ratio, 0, 0);

        particles = Array.from(
          { length: particleCount },
          () => createParticle(false)
        );
      }

      function draw(time) {
        context.clearRect(0, 0, width, height);

        particles.forEach((particle) => {
          const wave = reducedMotion.matches
            ? 0
            : Math.sin(time * 0.00035 + particle.phase) * particle.drift;

          const x = particle.x + wave;
          const y = particle.y;
          let opacity = particle.alpha;

          if (pointer.active && !reducedMotion.matches) {
            const distanceX = x - pointer.x;
            const distanceY = y - pointer.y;
            const distance = Math.sqrt(
              distanceX * distanceX + distanceY * distanceY
            );

            if (distance < 140) {
              opacity = Math.min(
                0.95,
                opacity + (1 - distance / 140) * 0.24
              );
            }
          }

          context.beginPath();
          context.arc(x, y, particle.radius, 0, Math.PI * 2);
          context.globalAlpha = opacity;
          context.fillStyle = particle.color;
          context.shadowBlur = reducedMotion.matches ? 0 : 10;
          context.shadowColor = particle.color;
          context.fill();

          context.shadowBlur = 0;

          if (!reducedMotion.matches) {
            particle.y -= particle.speed;
            particle.x +=
              Math.sin(time * 0.00016 + particle.phase) * 0.035;
          }

          if (particle.y < -12) {
            Object.assign(particle, createParticle(true));
          }
        });

        context.globalAlpha = 1;
        animationFrame = requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);

      window.addEventListener("pointermove", (event) => {
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        pointer.active = true;
      });

      window.addEventListener("pointerleave", () => {
        pointer.active = false;
      });

      reducedMotion.addEventListener("change", resize);

      resize();
      animationFrame = requestAnimationFrame(draw);

      window.addEventListener("beforeunload", () => {
        cancelAnimationFrame(animationFrame);
      });
    </script>
  </body>
</html>
